[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-experiment"
version = "0.1.0"
description = "Fixed-window MAC accumulation precision experiments for FP8 E4M3 and TF32"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "numpy>=1.24"]
dev = ["pytest>=7", "matplotlib>=3.7", "numpy>=1.24", "pyyaml>=6"]

[project.scripts]
mac-experiment = "mac_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["experiments/src"]
include = ["mac_experiment*"]

[tool.pytest.ini_options]
testpaths = ["hardware/verification/tests", "experiments/tests"]
pythonpath = ["experiments/src", "experiments/tests/legacy", "hardware/verification", "hardware/verification/tools"]
