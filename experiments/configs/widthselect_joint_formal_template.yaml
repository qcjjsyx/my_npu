# Formal template -- joint verification C_(b+1) = HWAdd_{W_acc}(C_b, q_b(W_align)).
# NOT executed in this round.  Fresh inputs only.
#
# Only the explicitly listed combinations run; there is no default 2-D sweep.
# Isolated qualification does not imply a joint one, so joint results are
# reported separately.  Fill the combinations from the candidates passing the
# isolated W_align / W_acc scans (docs/mac_width_selection.md section 5).
mode: widthselect_joint
M: 32
N: 32
K_list: [128, 256, 512, 1024, 2048, 4096,8192,16384]
formats: [mx_fp8, tf32]
distribution_pairs:
  - {activation_distribution: gaussian, weight_distribution: gaussian}
  - {activation_distribution: laplace, weight_distribution: laplace}
  - {activation_distribution: student_t3, weight_distribution: student_t3}
  - {activation_distribution: outlier, weight_distribution: outlier}
  - {activation_distribution: uniform, weight_distribution: uniform}
  - {activation_distribution: positive, weight_distribution: positive}
seeds: [1, 2, 3, 4, 5]
pairs_per_seed: 2
joint_pairs:
  - {w_align: 21, w_acc: 30}
  - {w_align: 24, w_acc: 30}
  - {w_align: 24, w_acc: 36}
  - {w_align: 21, w_acc: 36}
# pass_criteria is intentionally omitted: report-only until the user fixes thresholds.
# pass_criteria:
#   min_bit_match_rate: 0.95
#   max_ulp_p99: 1
#   max_ulp_max: 4
#   nonfinite_policy: reject
output_root: results/numerical/widthselect/runs
run_name: null
